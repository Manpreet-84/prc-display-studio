[package]
name = "prc-lcd"
version = "0.1.0"
edition = "2021"

[dependencies]
image = "0.25"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38"
nvml-wrapper = "0.13"
wmi = { version = "0.18", default-features = false }
hidapi = "2"
rusb = "0.9"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"


[features]
default = ["live-telemetry"]
live-telemetry = []
